name: Lint, Test and Deploy
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout Git repository
        uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  Test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout Git Repository
        uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test

  Deploy:
    needs: Test
    runs-on: ubuntu-latest
    steps:
      - name: checkout Git Repository
        uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Run build
        run: npm run build
      - name: Deploy to server
        run: echo "Deploying..."